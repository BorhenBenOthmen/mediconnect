# ========================================
# MediConnect SOAP Service
# Configuration MySQL 9.5 (caching_sha2_password)
# ========================================

spring.application.name=mediconnect-soap-service
server.port=8080

# ========================================
# MySQL 9.5 Database Configuration
# ========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mediconnect_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  IMPORTANT:
# - allowPublicKeyRetrieval=true est OBLIGATOIRE pour caching_sha2_password
# - Change "root" par TON mot de passe si différent

# ========================================
# Hibernate/JPA
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# SOAP Web Services
# ========================================
soap.service.path=/ws
soap.service.namespace=http://mediconnect.com/soap/services

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.com.mediconnect=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================================
# NOTES MYSQL 9.5:
#  Base de données créée: mediconnect_db
#  Plugin: caching_sha2_password (par défaut MySQL 9.5)
#  allowPublicKeyRetrieval=true (obligatoire)
# ========================================