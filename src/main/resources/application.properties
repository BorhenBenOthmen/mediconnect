# ========================================
# MediConnect REST API Configuration
# ========================================

# Application
spring.application.name=mediconnect-rest-api
server.port=8081

# ========================================
# SOAP Service Client Configuration
# ========================================
soap.client.url=http://localhost:8080/ws
soap.client.namespace=http://mediconnect.com/soap/services
soap.client.connection-timeout=5000
soap.client.read-timeout=10000

# ========================================
# JWT Configuration
# ========================================
jwt.secret=MyS3cr3tK3yF0rM3d1C0nn3ctJWTT0k3nS1gn1ng2024V3ryL0ngS3cr3t
jwt.expiration=86400000
# 86400000 ms = 24 heures

# ========================================
# CORS Configuration
# ========================================
cors.allowed-origins=http://localhost:3000,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ========================================
# Actuator (Monitoring)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.com.mediconnect=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n