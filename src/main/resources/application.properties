# ========================================
# MediConnect SOAP Service Configuration
# Configuration pour MySQL 9.x
# ========================================

# Application
spring.application.name=mediconnect-soap-service
server.port=8080

# ========================================
# Database Configuration (MySQL 9.x)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/mediconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ⚠️ IMPORTANT: Change le mot de passe si différent
# Exemple: spring.datasource.password=VotreMdp

# JPA/Hibernate (Compatible MySQL 9.x)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================
# SOAP Web Services Configuration
# ========================================
soap.service.path=/ws
soap.service.namespace=http://mediconnect.com/soap/services

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.com.mediconnect=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================================
# NOTES MYSQL 9.x:
# - MySQL 9.x utilise par défaut caching_sha2_password
# - allowPublicKeyRetrieval=true est OBLIGATOIRE
# - Si problème persist, utilise mysql_native_password (voir ci-dessous)
# ========================================